name: Build CVs

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cv: [general_cv, data_science_cv, lab_tech_cv]
    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.cv }}
        uses: dante-ev/latex-action@latest
        with:
          root_file: cv.tex
          working_directory: ${{ matrix.cv }}

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cv }}
          path: ${{ matrix.cv }}/cv.pdf

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all PDFs
        uses: actions/download-artifact@v4
        with:
          path: pdfs

      - name: Move PDFs to folders
        run: |
          mv pdfs/general_cv/cv.pdf general_cv/cv.pdf
          mv pdfs/data_science_cv/cv.pdf data_science_cv/cv.pdf
          mv pdfs/lab_tech_cv/cv.pdf lab_tech_cv/cv.pdf

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add */cv.pdf
          git diff --staged --quiet || git commit -m "Update CV PDFs"
          git push
